server:
  port: 8080

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: empresa-service
            uri: http://localhost:8081
            predicates:
              - Path=/empresas/**

          - id: usuario-service
            uri: http://localhost:8082
            predicates:
              - Path=/usuarios/**

          - id: proyecto-service
            uri: http://localhost:8083
            predicates:
              - Path=/proyectos/**
